name: CI & Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeCheck & Production Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://axsxwnwpcnhahzslktne.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4c3h3bndwY25oYWh6c2xrdG5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzQyMjUsImV4cCI6MjEwMjAxMDIyNX0.d9Q6jg-9onLh0N2pz42ElFPyMFuO9_UyyriFKrttRhk' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Validation
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build
